<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Ivo Alterman y German Peirone">
  <meta name="description" content="Detalle del producto en CrewLab: imágenes, talles, precio y compra online.">
  <meta name="keywords" content="CrewLab, producto, detalle, talles, moda urbana">
  <title>CrewLab - Detalle del producto</title>
  <link rel="icon" href="imagenes/favicon/favicon-crewlab.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="pagina">
    <header>
      <h1 class="logo"><a href="index.html">CrewLab</a></h1>
      <div class="acciones">
        <button class="carrito" id="carrito-boton" type="button" onclick="alternarCarrito()" aria-label="Abrir carrito">
          🛒<span class="carrito-contador" id="carrito-contador"></span>
        </button>
        <button class="menu-hamburguesa" id="menu-boton" type="button" onclick="alternarMenu()" aria-label="Abrir menú" aria-expanded="false">☰</button>
      </div>
      <nav class="menu-desplegable" id="menu" aria-label="Navegación principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="remeras.html">Remeras</a></li>
          <li><a href="buzos.html">Buzos</a></li>
          <li><a href="pantalones.html">Pantalones</a></li>
          <li><a href="zapatillas.html">Zapatillas</a></li>
          <li><a href="checkout.html">Finalizar compra</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="producto-detalle" id="producto-detalle">
        <div class="galeria">
          <div class="miniaturas" id="miniaturas"></div>
          <img id="imagen-principal" src="imagenes/favicon/favicon-crewlab.png" alt="Imagen del producto">
        </div>

        <div class="info-producto">
          <h2 id="producto-nombre">Producto</h2>
          <p id="producto-precio">$0</p>
          <p id="producto-descripcion" class="descripcion"></p>

          <div class="opciones">
            <div class="opcion">
              <label for="talle">Talle</label>
              <select id="talle"></select>
            </div>
            <div class="opcion">
              <label for="cantidad">Cantidad (1 a 10)</label>
              <input type="text" id="cantidad" inputmode="numeric" value="1" oninput="actualizarSubtotal()">
            </div>
          </div>

          <p id="producto-subtotal" class="subtotal">Subtotal: $0</p>
          <button type="button" id="boton-agregar" onclick="agregarProductoActual()">Agregar al carrito</button>
        </div>
      </div>

      <div class="aviso oculto" id="producto-no-encontrado">
        <h2>Producto no encontrado</h2>
        <p>El producto que buscás no existe o ya no está disponible.</p>
        <a href="index.html" class="ver-mas">Volver al inicio</a>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 CrewLab - Todos los derechos reservados.</p>
    </footer>
  </div>

  <div id="carrito-modal" class="carrito-modal oculto" role="dialog" aria-modal="true" aria-labelledby="carrito-titulo">
    <h2 id="carrito-titulo">Tu carrito</h2>
    <ul id="carrito-lista"></ul>
    <p id="carrito-total">Total: $0</p>
    <div class="carrito-botones">
      <button type="button" class="boton-secundario" onclick="vaciarCarrito()">Vaciar carrito</button>
      <button type="button" class="boton-secundario" onclick="cerrarCarrito()">Cerrar</button>
      <button type="button" class="boton-confirmar" onclick="irAlCheckout()">Finalizar compra</button>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script src="js/productos.js"></script>
</body>
</html>
